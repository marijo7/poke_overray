<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>採用率オーバーレイ</title>
<!--
  OBS のブラウザソースに http://127.0.0.1:8765/overlay を指定して使う。
  URL パラメータ:
    slot=opp1          表示する領域 ID (カンマ区切りで複数可。省略時は相手側の領域すべて)
    sprite=0           ポケモンの画像を非表示
    stats=0            種族値を非表示
    nature=0           性格を非表示
    natures=2          性格の表示件数
    spreads=0          能力ポイント配分の表示件数 (既定は非表示)
    moves=6 items=3 abilities=2   表示件数 (0 で非表示)。行数が多いと 1 行を細くして、カードの大きさは変えない
    w=300 h=600        カードの幅・高さ (px) を固定。省略時も、データの量によらず同じ大きさになるよう行数を固定している
    layout=row         カードを横並びにする (既定は縦並び)
    history=1          この対戦で見た相手の一覧を表示
    font=メイリオ / gfont=M PLUS Rounded 1c / fontfile=MyFont.ttf   フォントの変更 (font.js 参照)
    scale=1.2          全体の拡大率
    theme=light        明るい配色
-->
<style>
  :root {
    --font-default: "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", "Hiragino Sans", sans-serif;
    --bg: rgba(16, 18, 28, 0.86);
    --fg: #f4f6fb;
    --sub: #a9b0c4;
    --accent: #ffcc33;
    --bar: #4f8cff;
    --bar-bg: rgba(255, 255, 255, 0.10);
    --border: rgba(255, 255, 255, 0.14);
    --scale: 1;
  }
  :root[data-theme="light"] {
    --bg: rgba(250, 251, 255, 0.92);
    --fg: #1b1f2c;
    --sub: #5b6377;
    --accent: #d9480f;
    --bar: #2f6fe4;
    --bar-bg: rgba(0, 0, 0, 0.08);
    --border: rgba(0, 0, 0, 0.12);
  }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body {
    font-family: var(--font, var(--font-default)); font-weight: var(--font-weight, 400);
    color: var(--fg);
    zoom: var(--scale);
  }
  #cards { display: flex; flex-direction: column; gap: 10px; padding: 8px; align-items: flex-start; }
  #cards.row { flex-direction: row; }
  .card {
    width: var(--card-w, 300px); height: var(--card-h, auto); overflow: hidden; box-sizing: border-box;
    background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 14px 12px; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    animation: pop 0.35s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .head { display: flex; align-items: center; gap: 8px; border-bottom: 2px solid var(--accent); padding-bottom: 4px; margin-bottom: 6px; }
  .head img { width: 44px; height: 44px; object-fit: contain; margin: -6px 0 -4px -4px; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.5)); }
  .title { min-width: 0; }
  .name { font-size: 22px; font-weight: 800; letter-spacing: 0.02em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank { font-size: 12px; color: var(--sub); white-space: nowrap; }
  .sec-title { font-size: 11px; color: var(--accent); font-weight: 700; margin: 6px 0 2px; letter-spacing: 0.1em; }
  .row-item { position: relative; display: flex; justify-content: space-between; font-size: 15px; line-height: 22px; padding: 0 6px; margin: 2px 0; border-radius: 4px; background: var(--bar-bg); overflow: hidden; }
  .row-item .fill { position: absolute; inset: 0 auto 0 0; background: var(--bar); opacity: 0.45; border-radius: 4px; }
  .row-item span { position: relative; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-item .pct { font-variant-numeric: tabular-nums; margin-left: 8px; flex: none; }
  .stats { display: grid; grid-template-columns: repeat(6, 1fr) auto; gap: 3px; align-items: end; margin: 2px 0 2px; }
  .stat { text-align: center; font-size: 10px; color: var(--sub); }
  .stat b { display: block; font-size: 14px; color: var(--fg); font-variant-numeric: tabular-nums; }
  .stat i { display: block; height: 4px; margin-top: 2px; border-radius: 2px; background: var(--bar-bg); overflow: hidden; }
  .stat i::after { content: ""; display: block; height: 100%; width: var(--v); background: var(--bar); }
  .stat.spe b { color: var(--accent); }
  .stat.total { padding-left: 4px; }
  .build { font-size: 13px; line-height: 20px; padding: 0 6px; border-radius: 4px; background: var(--bar-bg); display: flex; justify-content: space-between; gap: 8px; }
  .build .sub { color: var(--sub); font-size: 11px; }
  /* どのカードも同じ高さになるよう、各行の高さを固定 */
  .head { height: 48px; box-sizing: border-box; }
  .name { height: 26px; line-height: 26px; }
  .rank { height: 15px; line-height: 15px; }
  .mega { height: 16px; line-height: 16px; }
  .mega b { line-height: 16px; }
  .sec-title { height: 14px; line-height: 14px; }
  .row-item { height: var(--row-h, 22px); line-height: var(--row-h, 22px); font-size: var(--row-fs, 15px); box-sizing: border-box; }
  .stats { height: 34px; }
  .credit { height: 12px; line-height: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.ghost { visibility: hidden; animation: none; }
  .row-item.empty { background: var(--bar-bg); opacity: 0.4; }
  .head img:not([src]), .head .noimg { display: none; }
  .mega { min-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; color: var(--accent); margin: 4px 0 0; }
  .mega b { font-weight: 800; }
  .nodata { font-size: 13px; color: var(--sub); padding: 4px 0; }
  .credit { font-size: 9px; color: var(--sub); margin-top: 6px; text-align: right; }
  #history { display: none; gap: 6px; flex-wrap: wrap; padding: 0 8px 8px; }
  #history.show { display: flex; }
  .chip { background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
</style>
<script src="/font.js"></script>
</head>
<body>
<div id="cards"></div>
<div id="history"></div>
<script>
  const q = new URLSearchParams(location.search);
  const opt = {
    slots: q.get("slot") ? q.get("slot").split(",") : null,
    moves: +(q.get("moves") ?? 6),
    items: +(q.get("items") ?? 3),
    abilities: +(q.get("abilities") ?? 2),
    sprite: q.get("sprite") !== "0",
    stats: q.get("stats") !== "0",
    nature: q.get("nature") !== "0",
    natureCount: +(q.get("natures") ?? 2),
    spreads: +(q.get("spreads") ?? 0),
  };
  if (q.get("w")) document.documentElement.style.setProperty("--card-w", parseInt(q.get("w"), 10) + "px");
  if (q.get("h")) document.documentElement.style.setProperty("--card-h", parseInt(q.get("h"), 10) + "px");
  // 行数が多いときは 1 行を細くして、カードの大きさを 10 行ぶん (技 4・持ち物 2・特性 2・性格 2) のときと同じに保つ
  {
    const rows = opt.moves + opt.items + opt.abilities + (opt.nature ? opt.natureCount + opt.spreads : 0);
    if (rows > 10) {
      const step = 240 / rows;              // 10 行 × 24px (行 22px + 間 2px) の高さに収める
      const h = step - 2;
      document.documentElement.style.setProperty("--row-h", h + "px");
      document.documentElement.style.setProperty("--row-fs", Math.max(11, Math.min(15, Math.round(h * 0.72))) + "px");
    }
  }
  const LABELS = ["H", "A", "B", "C", "D", "S"];

  function statsBlock(stats) {
    if (!opt.stats) return "";
    stats = stats || [null, null, null, null, null, null];
    const cells = stats.map((v, i) => `<div class="stat${i === 5 ? " spe" : ""}">${LABELS[i]}<b>${v ?? "-"}</b><i style="--v:${Math.min(100, (v || 0) / 1.8)}%"></i></div>`).join("");
    const total = stats[0] == null ? "-" : stats.reduce((a, b) => a + b, 0);
    return `<div class="sec-title">種族値</div><div class="stats">${cells}<div class="stat total">計<b>${total}</b><i style="--v:0"></i></div></div>`;
  }

  function natureBlock(p) {
    if (!opt.nature) return "";
    let natures = p.natures || [];
    const b = p.top_build;
    if (!natures.length && b && b.nature) {  // Pikalytics のシングル: 最も多い型の性格だけ
      natures = [{ name: b.nature.name + (b.nature.up ? ` (${b.nature.up}↑${b.nature.down}↓)` : ""), pct: b.pct }];
    }
    return section("性格", natures, opt.natureCount)
      + section("能力ポイント", p.spreads, opt.spreads);
  }
  if (q.get("layout") === "row") document.getElementById("cards").classList.add("row");
  if (q.get("history") === "1") document.getElementById("history").classList.add("show");
  if (q.get("scale")) document.documentElement.style.setProperty("--scale", q.get("scale"));
  if (q.get("theme")) document.documentElement.dataset.theme = q.get("theme");

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // 常に n 行ぶん描く (データが足りない行は空欄)。カードの大きさがデータ量で変わらないようにするため
  function section(title, list, n) {
    if (!n) return "";
    list = list || [];
    const rows = Array.from({ length: n }, (_, i) => list[i]).map((m) => m ? `
      <div class="row-item"><div class="fill" style="width:${Math.min(100, m.pct)}%"></div>
        <span>${esc(m.name)}</span><span class="pct">${m.pct.toFixed(1)}%</span></div>`
      : `<div class="row-item empty"><span>&nbsp;</span></div>`).join("");
    return `<div class="sec-title">${title}</div>${rows}`;
  }

  const img = (slot) => (opt.sprite && slot.sprite ? `<img src="/sprite/${slot.sprite}.png" alt="" onerror="window.__imgFailedAt=Date.now();this.remove()">` : "");

  const EMPTY = { moves: [], items: [], abilities: [], natures: [], spreads: [], mega: [] };

  function card(slot, meta) {
    if (!slot.species) return `<div class="card ghost">${cardBody({}, EMPTY, meta)}</div>`;  // 場所だけ確保
    return `<div class="card">${cardBody(slot, slot.pokemon || EMPTY, meta)}</div>`;
  }

  // メガリザードンY → "Y"、メガガブリアス → "通常" (行に収まるよう種族名を省く)
  const megaLabel = (m, p) => m.display.replace(/^メガ/, "").replace(p.species || "", "") || "通常";

  function cardBody(slot, p, meta) {
    const rank = !slot.pokemon ? (slot.species ? "採用率データなし" : "")
      : p.rank ? `使用率 ${p.rank}位${p.usage != null ? ` (${p.usage.toFixed(1)}%)` : ""}` : "";
    // メガシンカ前: メガストーンの採用率 / メガシンカ後: 特性はメガシンカ後のものに確定
    // 行の高さを固定するため、メガシンカと無関係なポケモンでも空の行を置く
    const megaLine = slot.mega ? `<div class="mega"><b>メガシンカ済み</b></div>`
      : (p.mega && p.mega.length ? `<div class="mega">メガシンカ率 <b>${p.mega.reduce((a, m) => a + m.pct, 0).toFixed(0)}%</b>
          ${p.mega.length > 1 ? "(" + p.mega.map((m) => esc(megaLabel(m, p)) + " " + m.pct.toFixed(0) + "%").join(" / ") + ")" : ""}</div>`
        : `<div class="mega">&nbsp;</div>`);
    const abilities = slot.mega && slot.form_abilities.length ? slot.form_abilities.map((n) => ({ name: n, pct: 100 })) : p.abilities;
    const credit = meta && meta.source ? `データ: ${esc(meta.source)} ${esc(meta.format || "")} ${esc(meta.data_date || "")}` : "";
    return `
      <div class="head">${img(slot)}<div class="title"><div class="name">${esc(slot.display || p.display || slot.species || "")}&nbsp;</div><div class="rank">${rank}&nbsp;</div></div></div>
      ${megaLine}
      ${statsBlock(slot.stats)}
      ${section("技", p.moves, opt.moves)}
      ${section("持ち物", p.items, opt.items)}
      ${section(slot.mega ? "特性 (メガシンカ後)" : "特性", abilities, opt.abilities)}
      ${natureBlock(p)}
      <div class="credit">${credit}&nbsp;</div>`;
  }

  let lastSig = "";
  async function tick() {
    try {
      const st = await (await fetch("/api/state", { cache: "no-store" })).json();
      if (window.applyOverlayFont) window.applyOverlayFont(st.display);  // 設定画面で選んだフォント
      // ツールを更新した (表示用ファイルが変わった) ら、OBS 側でも自動で新しいページに読み込み直す
      if (st.app_version) { if (window.__appVersion && window.__appVersion !== st.app_version) location.reload(); window.__appVersion = st.app_version; }
      // 画像の取得に失敗していたら、数秒おきに描き直して取り直す
      if (window.__imgFailedAt && Date.now() - window.__imgFailedAt > 4000) { window.__imgFailedAt = 0; lastSig = ""; }
      // ポケモンがいない枠も (見えないカードで) 場所を確保し、カードの位置がずれないようにする
      const slots = st.slots.filter((s) => (opt.slots ? opt.slots.includes(s.id) : s.side === "opp"));
      const sig = JSON.stringify([slots.map((s) => [s.id, s.display, s.sprite, s.mega, s.pokemon && s.pokemon.key, s.pokemon && s.pokemon.natures]), st.history, st.usage_meta]);
      if (sig !== lastSig) {
        lastSig = sig;
        document.getElementById("cards").innerHTML = slots.map((s) => card(s, st.usage_meta)).join("");
        document.getElementById("history").innerHTML = st.history.map((h) => `<span class="chip">${esc(h.display)}</span>`).join("");
      }
    } catch (e) { /* サーバー停止中は何もしない */ }
    setTimeout(tick, 500);
  }
  tick();
</script>
</body>
</html>
